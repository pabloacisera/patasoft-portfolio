version: '3.9'

# Docker Compose para producción
# Nota: PostgreSQL y Redis se usan desde Render
# Este archivo es para referencia y potenciales despliegues futuros

services:
  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped

  # Frontend Vite (build only, servimos estáticos con nginx)
  # Para desarrollo local usar: cd frontend && npm run dev

  # AI Service FastAPI
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/ai.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=production
    env_file:
      - .env
    restart: unless-stopped

  # Nginx como reverse proxy (opcional para producción)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./docker/nginx.conf:/etc/nginx/nginx.conf
  #   depends_on:
  #     - backend
  #     - ai-service