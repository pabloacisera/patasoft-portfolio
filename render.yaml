# render.yaml - Despliegue a Render.com
# https://render.com/docs/deploy-to-render

# ============================================
# SERVICIOS
# ============================================

services:
  # --- FRONTEND (Static Site) ---
  - type: web
    name: patasoft-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: patasoft-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # --- BACKEND (NestJS Web Service) ---
  - type: web
    name: patasoft-backend
    runtime: node
    region: us-east
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # DATABASE_URL y REDIS_URL: sync:false para usar Supabase + Upstash externos
      # Configurar manualmente en Render Dashboard con URLs reales de Supabase/Upstash
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Supabase credenciales (configurar en Render Dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # JWT (generar con: openssl rand -base64 64)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
        # En producción real (Cloudflare Tunnel): https://api-patasoft.artisandevs.site/api/v1/auth/google/callback
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Mercado Pago
      - key: MP_APP_ID
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      # AI Service
      - key: AI_SERVICE_URL
        fromService:
          name: patasoft-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_API_KEY
        sync: false
      # Mailjet
      - key: MJ_APIKEY
        sync: false
      - key: MJ_APISECRET
        sync: false
      - key: MJ_SENDER_EMAIL
        value: noreply@patasoft.app
      - key: MJ_SENDER_NAME
        value: PataSoft
    autoDeploy: true

  # --- AI SERVICE (FastAPI Web Service) ---
  - type: web
    name: patasoft-ai
    runtime: python
    region: us-east
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: chroma-data
      mountPath: /opt/chroma_db
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # DATABASE_URL y REDIS_URL: sync:false para usar Supabase + Upstash externos
      # Configurar manualmente en Render Dashboard con URLs reales de Supabase/Upstash
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /opt/chroma_db
    autoDeploy: true