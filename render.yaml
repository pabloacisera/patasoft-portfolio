# render.yaml - Despliegue a Render.com
# https://render.com/docs/deploy-to-render

# ============================================
# SERVICIOS
# ============================================

services:
  # --- FRONTEND (Static Site) ---
  - type: web
    name: patasoft-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: patasoft-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # --- BACKEND (NestJS Web Service) ---
  - type: web
    name: patasoft-backend
    runtime: node
    region: us-east
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: patasoft-db
          property: connectionString
      - key: REDIS_URL
        fromKvStore:
          name: patasoft-kv
      # JWT (generar con: openssl rand -base64 64)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://patasoft-api.onrender.com/auth/google/callback
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Mercado Pago
      - key: MP_APP_ID
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      # AI Service
      - key: AI_SERVICE_URL
        fromService:
          name: patasoft-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Mailjet
      - key: MJ_APIKEY
        sync: false
      - key: MJ_APISECRET
        sync: false
      - key: MJ_SENDER_EMAIL
        value: noreply@patasoft.app
      - key: MJ_SENDER_NAME
        value: PataSoft
    autoDeploy: true

  # --- AI SERVICE (FastAPI Web Service) ---
  - type: web
    name: patasoft-ai
    runtime: python
    region: us-east
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: patasoft-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
    autoDeploy: true

# ============================================
# BASE DE DATOS
# ============================================

databases:
  - name: patasoft-db
    plan: free
    databaseName: patasoft_db
    ipAllowList: []

# ============================================
# KEY-VALUE STORE (Redis)
# ============================================

renderKvStores:
  - name: patasoft-kv
    plan: free
    ipAllowList: []