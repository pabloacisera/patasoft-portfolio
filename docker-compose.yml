services:
  # PostgreSQL con pgvector para RAG
  postgres:
    image: pgvector/pgvector:pg15
    container_name: patasoft-postgres
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: patasoft_db
      POSTGRES_USER: patasoft
      POSTGRES_PASSWORD: patasoft_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patasoft -d patasoft_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patasoft_network

  # Redis para sesiones y cache
  redis:
    image: redis:7-alpine
    container_name: patasoft-redis
    volumes:
      - ./docker/redis-data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patasoft_network

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patasoft-backend
    # Sin 'command' → usa CMD del Dockerfile (start.sh que compila y corre dist/)
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://patasoft:patasoft_dev@postgres:5432/patasoft_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production_abc123
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_change_xyz789
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev_google_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev_google_secret}
      GOOGLE_CALLBACK_URL: http://localhost/api/v1/auth/google/callback
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-demo}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-demo}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-dev_token}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-dev_key}
      MJ_APIKEY: ${MJ_APIKEY:-dev_key}
      MJ_APISECRET: ${MJ_APISECRET:-dev_secret}
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - patasoft_network

  # AI Service FastAPI
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: patasoft-ai
    volumes:
      - ./ai-service:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://patasoft:patasoft_dev@postgres:5432/patasoft_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dev_openai_key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dev_gemini_key}
      GROQ_API_KEY: ${GROQ_API_KEY:-dev_groq_key}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patasoft_network

  # Frontend Vite + Nginx (Producción)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patasoft-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - patasoft_network

networks:
  patasoft_network:
    name: patasoft_network
    driver: bridge

volumes:
  postgres-data:
  redis-data: